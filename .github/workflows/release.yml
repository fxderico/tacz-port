name: Release

# Builds every Minecraft version and attaches the jars to a release. Triggered by pushing a v* tag, publishing a
# release by hand, running it manually, or pushing a change of .github/release-tag (the tag to create) to tacz-port
on:
  push:
    tags: ["v*"]
    branches: [tacz-port]
    paths: [.github/release-tag]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release on (made from the selected branch)
        default: v1.1.8-hotfix

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else echo "name=$(tr -d '[:space:]' < .github/release-tag)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the 1.21.x toolchains, 25 last so it runs Gradle and the 26.x builds
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      # every version that builds
      - run: >-
          chmod +x gradlew && ./gradlew --no-daemon -x test
          :1.21.1:build :1.21.3:build :1.21.4:build :1.21.5:build :1.21.8:build :1.21.10:build :1.21.11:build
          :26.1.2:build :26.2:build :26.3:build
          :1.21.1-neoforge:build :1.21.3-neoforge:build :1.21.4-neoforge:build :1.21.5-neoforge:build :1.21.8-neoforge:build
          :1.21.10-neoforge:build :1.21.11-neoforge:build :26.1.2-neoforge:build :26.2-neoforge:build :26.3-neoforge:build
          :1.21.10-forge:build :1.21.11-forge:build
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/tacz-*.jar
      - uses: softprops/action-gh-release@v2
        with:
          # created on the commit that was built when it does not exist yet
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: versions/*/build/libs/tacz-*.jar
          body_path: .github/release-notes.md
          generate_release_notes: true
