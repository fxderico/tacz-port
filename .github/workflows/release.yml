name: Release

# Publish a release on GitHub and this builds every Minecraft version and attaches the jars to it
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the 1.21.x toolchains, 25 last so it runs Gradle and the 26.x builds
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: versions/*/build/libs/tacz-fabric-*.jar
          generate_release_notes: true
