name: Release

# Builds every Minecraft version and attaches the jars to a release. Triggered by pushing a v* tag, publishing a
# release by hand, running it manually, or pushing a change of .github/release-tag (the tag to create) to tacz-port
on:
  push:
    tags: ["v*"]
    branches: [tacz-port]
    paths: [.github/release-tag]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release on (made from the selected branch)
        default: v1.1.8-hotfix

permissions:
  contents: write

jobs:
  # one job per jar: every NeoForge/Forge version sets up its own Minecraft, all of them at once fill a runner's disk
  build:
    runs-on: ubuntu-latest
    # Forge 26.x sets up Minecraft slowly on hosted runners (26.2 took over 90 minutes)
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        project:
          - "1.21.1"
          - "1.21.3"
          - "1.21.4"
          - "1.21.5"
          - "1.21.8"
          - "1.21.10"
          - "1.21.11"
          - "26.1.2"
          - "26.2"
          - "26.3"
          - "1.21.1-neoforge"
          - "1.21.3-neoforge"
          - "1.21.4-neoforge"
          - "1.21.5-neoforge"
          - "1.21.8-neoforge"
          - "1.21.10-neoforge"
          - "1.21.11-neoforge"
          - "26.1.2-neoforge"
          - "26.2-neoforge"
          - "26.3-neoforge"
          - "1.21.1-forge"
          - "1.21.3-forge"
          - "1.21.4-forge"
          - "1.21.5-forge"
          - "1.21.8-forge"
          - "1.21.10-forge"
          - "1.21.11-forge"
          - "26.1.2-forge"
          - "26.2-forge"
          - "26.3-forge"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the 1.21.x toolchains, 25 last so it runs Gradle and the 26.x builds
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - run: chmod +x gradlew && ./gradlew --no-daemon -x test ":${{ matrix.project }}:build"
        env:
          TACZ_PROJECT: ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.project }}
          path: versions/${{ matrix.project }}/build/libs/tacz-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else echo "name=$(tr -d '[:space:]' < .github/release-tag)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # created on the commit that was built when it does not exist yet
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: jars/tacz-*.jar
          body_path: .github/release-notes.md
          generate_release_notes: true
