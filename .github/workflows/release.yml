name: Release

# Pushing a v* tag (or publishing a release by hand) builds every Minecraft version and attaches the jars to the release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release on (made from the selected branch)
        default: v1.1.8-hotfix

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the 1.21.x toolchains, 25 last so it runs Gradle and the 26.x builds
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      # every version that builds; NeoForge 26.3 is not ported yet
      - run: >-
          chmod +x gradlew && ./gradlew --no-daemon -x test
          :1.21.1:build :1.21.3:build :1.21.5:build :1.21.10:build :1.21.11:build
          :26.1.2:build :26.2:build :26.3:build
          :1.21.11-neoforge:build :26.1.2-neoforge:build :26.2-neoforge:build
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/tacz-*.jar
      - uses: softprops/action-gh-release@v2
        with:
          # a manual run creates the tag on the branch it ran on
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: versions/*/build/libs/tacz-*.jar
          body_path: .github/release-notes.md
          generate_release_notes: true
