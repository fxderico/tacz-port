name: Release

# Publish a release (or push a tag like v1.1.8-fabric.1) to build the mod and attach the jar to it
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/tacz-fabric-*.jar
          generate_release_notes: true
