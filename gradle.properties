# Gradle options only, mod and dependency versions are in stonecutter.properties.toml
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# every NeoForge/Forge version decompiles Minecraft with a 4 GB tool, more than two at once runs a 16 GB machine out of memory
org.gradle.workers.max=2

# ForgeGradle: classes and resources share one folder per source set, a Forge dev run needs each mod in one root
net.minecraftforge.gradle.merge-source-sets=true
